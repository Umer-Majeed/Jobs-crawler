name: Project Titan Autonomous Job Hunter

on:
  schedule:
    # Har 3 ghante baad automatically chalega (UTC time)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Direct manually run karne ke liye button

jobs:
  run-titan:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Git push aur auto-commit ke liye zaroori hai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Titan Discovery Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python titan_pipeline.py

      - name: Auto Commit Updated Tracker CSV and DB
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "action@github.com"
          git add titan_application_tracker.csv titan_memory.db generated_cover_letters/ || true
          git commit -m "Auto-update memory DB, tracker CSV and generated letters [skip ci]" || exit 0
          git pull origin main --rebase
          git push