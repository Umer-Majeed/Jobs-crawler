name: Project Titan Autonomous Job Hunter

on:
  schedule:
    # Har 3 ghante baad automatically chalega (UTC time)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Direct manually run karne ke liye button bhi dega

jobs:
  run-titan:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Git push aur auto-commit ke liye zaroori hai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Titan Discovery Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python titan_pipeline.py

      - name: Auto Commit Updated Tracker CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add titan_application_tracker.csv generated_cover_letters/ || true
          git commit -m "Auto-update application tracker CSV and generated letters [skip ci]" || exit 0
          git push